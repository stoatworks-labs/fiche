name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# macOS and Windows. The CMakeLists branches on APPLE and WIN32 and has no
# Linux path at all, so ubuntu is not an option. The Windows job is pitch's,
# adapted: a GLEW-shaped break is one macOS is structurally blind to, because
# macOS never links GLEW. (Fiche has never been built on Windows; this job is
# the first place it would be.)
#
# The macOS runner cannot create an accelerated GL context, so the harness runs
# `mftest --offline`: every check mftest's main() marks as needing no GL, and
# their negative controls. The shaders are covered the other way, by glslc.
# The pixel checks run in tools/verify.sh, on a Mac with a GPU and again on
# Apple's software renderer at 320x180 -- what this runner would fall back to.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # FICHE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # mftest is a large slice of the C++, and --offline needs it.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DFICHE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/mftest --list

      - name: Offline checks
        # Physics and registration, with their negative controls, and never a
        # GL context. The set is defined once, in mftest's main(); it is not
        # listed here, so a new check cannot silently go untested in CI.
        timeout-minutes: 30
        run: ./build/mftest --offline

      - name: Shaders compile
        # The same script tools/verify.sh runs. GLSLC_REQUIRED: a runner
        # without glslc must fail, not skip.
        run: |
          brew install shaderc
          GLSLC_REQUIRED=1 tools/glslc.sh

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: fiche-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing. Tools off: mftest
        # links CGL and is macOS-only.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DFICHE_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: fiche-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
